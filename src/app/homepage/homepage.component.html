<div>
    <h2>Sommaire des fonctionnalités</h2>
    @for(feature of featureList() ; track feature.id) {
        <mat-card class="feature-card" appFeatureBorder [featureType]="feature.type" appearance="outlined" >
            <mat-card-header>
                <mat-card-title-group>
                    <mat-card-title>{{ feature.title }}</mat-card-title>
                </mat-card-title-group>
            </mat-card-header>
            <mat-card-content>
                Code : {{ feature.path }}<br />
                @if(feature.url === 'home') {
                <button mat-fab extend disabled class="go-to-button" >Nous y sommes !</button>
                } @else {
                <a mat-fab extend href="{{ feature.url }}" class="go-to-button">Y aller !</a>
                }
            </mat-card-content>
        </mat-card>
    }
</div>
