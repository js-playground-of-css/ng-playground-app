<div class="btn-group m-2" role="group" aria-label="Prochains jours fériés">
    <mat-toolbar>
        <button type="button" mat-button>
            {{libelleProchainJoursFeries()}} {{dureeProchainJoursFeries()}}
        </button>
        
        @if(this.aJoursFeriesSuivant()) {
        <button mat-button [matMenuTriggerFor]="menuJoursFeriesSuivants" >
            Jours fériés suivants <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #menuJoursFeriesSuivants="matMenu" >
            @for(joursFeriesApres of this.joursFeriesSuivant() ; track joursFeriesApres.getJoursStr()) {
            <button mat-menu-item >{{joursFeriesApres.getLibelle()}}</button>
            }
        </mat-menu>
        }
    </mat-toolbar>
</div>
