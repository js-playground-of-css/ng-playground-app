<div class="btn-group m-2" role="group" aria-label="Prochains jours fériés">
    <button type="button" class="btn-solid theme-primary">
        {{libelleProchainJoursFeries()}} <span class="badge theme-subtle">{{dureeProchainJoursFeries()}}</span>
    </button>
    
    @if(this.aJoursFeriesSuivant()) {
    <div class="btn-group">
        <button type="button" class="btn btn-outline theme-primary" >
            Jours fériés suivants
        </button>
        <button type="button" class="btn-outline theme-primary menu-toggle-split" data-bs-toggle="menu" aria-expanded="false" >
            <svg class="bi" width="16" height="16" aria-hidden="true"><use href="#chevron-expand" /></svg>
            <span class="visually-hidden">Toggle Menu</span>
        </button>
        <div class="menu">
            @for(joursFeriesApres of this.joursFeriesSuivant() ; track joursFeriesApres.getJoursStr()) {
            <span class="menu-item" >{{joursFeriesApres.getLibelle()}}</span>
            }
        </div>
    </div>
    }
</div>
