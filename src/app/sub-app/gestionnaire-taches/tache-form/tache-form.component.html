<div>
    <h2>{{ titrePage() }}</h2>
    <button mat-fab extended (click)="this.goToTodolist();" style="margin-bottom: 8px;" >
        <mat-icon>arrow_back</mat-icon>
        Retourner à la liste de tâches
    </button>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" >
        <p class="form-field-custom" >
            <mat-form-field appearance="outline" floatLabel="auto" >
                <mat-label>Titre</mat-label>
                <input 
                    type="text"
                    formControlName="titreTache"
                    matInput
                >
                <mat-error>
                    Le titre est obligatoire et doit faire minimum 5 caractères.
                </mat-error>
            </mat-form-field>
        </p>
        <p class="form-field-custom" >
            <mat-form-field appearance="outline" floatLabel="auto" >
                <mat-label>Description</mat-label>
                <textarea matInput rows="3" formControlName="descriptionTache" ></textarea>
                <mat-error>
                    La description est obligatoire et doit faire minimum 5 caractères.
                </mat-error>
            </mat-form-field>
        </p>
        <p class="form-field-custom" >
            <mat-form-field appearance="outline" >
                <mat-label>Date</mat-label>
                <input matInput [matDatepicker]="dateTacheChamp" formControlName="dateTache" >
                <mat-datepicker-toggle matIconSuffix [for]="dateTacheChamp" ></mat-datepicker-toggle>
                <mat-datepicker #dateTacheChamp ></mat-datepicker>
                <mat-error>
                    La date est obligatoire et doit être dans le présent ou le futur.
                </mat-error>
            </mat-form-field>
        </p>
        <mat-checkbox formControlName="completeTache" >
            {{ this.intituleTacheComplete() }}
        </mat-checkbox>
        <div>
            <button type="submit" mat-raised-button [disabled]="form.invalid" >{{ intituleBoutonAction() }}</button>
        </div>
    </form>
</div>
