<div class="m-2 text-white w-50" >
    <h2>Ajouter une tâche</h2>
    <div class="d-grid gap-2 d-md-block">
        <button class="btn btn-primary" type="button" (click)="this.goToTodolist();" >Retourner à la liste de tâche</button>
    </div>
    <form>
        <div class="mb-3">
            <label for="titreTache" class="form-label" >Titre</label>
            <input type="titreTache" class="form-control" id="titreTache" >
        </div>
        <button type="submit" class="btn btn-primary">Ajouter la tâche à la liste</button>
    </form>
</div>
