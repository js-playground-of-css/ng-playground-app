<div class="text-white m-2" >
    <h2>Gestionnaire rudimentaire de tâches</h2>
    <h3>Introduction</h3>
    <p>
        Le backend est assuré via le dépôt GitHub suivant : 
        <a href="https://github.com/java-playground-of-css/Todo-REST-API-Spring-Boot" >java-playground-of-css/Todo-REST-API-Spring-Boot</a>
    </p>
    <ul>
    @for(tache of taches(); track tache.todoId) {
        <li>{{ tache.todoTitle }}</li>
    } @empty {
        <li>Aucune tâche trouvée.</li>
    }
    </ul>
</div>
